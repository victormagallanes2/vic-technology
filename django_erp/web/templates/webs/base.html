<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page.name }}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: #ffffff;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 20px; }
        .hero p { font-size: 1.25rem; opacity: 0.9; margin-bottom: 30px; }
        .hero .cta {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
        }

        /* Contacto */
        .contact {
            padding: 80px 20px;
            background: #f9fafb;
        }
        .contact h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .contact .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 40px;
        }
        .contact form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .contact label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #374151;
        }
        .contact input,
        .contact textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .contact input:focus,
        .contact textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .contact textarea {
            resize: vertical;
            min-height: 120px;
        }
        .contact button {
            background: #667eea;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .contact button:hover { background: #5568d3; }
        .contact button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Mensajes */
        .form-message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            max-width: 500px;
            margin: 0 auto 20px;
        }
        .form-message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .form-message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        /* Footer */
        footer {
            background: #1f2937;
            color: #9ca3af;
            padding: 40px 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    {% block content %}{% endblock %}

    <footer>
        <p>&copy; {% now "Y" %} {{ page.name }}. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('lead-form');
            if (!form) return;

            const messageBox = document.getElementById('form-message');
            const submitBtn = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                messageBox.className = 'form-message';
                messageBox.textContent = '';

                const data = {
                    name: form.querySelector('[name="name"]').value.trim(),
                    email: form.querySelector('[name="email"]').value.trim(),
                    phone: form.querySelector('[name="phone"]').value.trim(),
                    message: form.querySelector('[name="message"]').value.trim(),
                };

                if (!data.name) {
                    messageBox.className = 'form-message error';
                    messageBox.textContent = 'El nombre es obligatorio.';
                    return;
                }
                if (!data.email || !data.email.includes('@')) {
                    messageBox.className = 'form-message error';
                    messageBox.textContent = 'El email es obligatorio y debe ser válido.';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify(data),
                })
                .then(response => response.json().then(body => ({ ok: response.ok, body })))
                .then(({ ok, body }) => {
                    if (ok && body.success) {
                        messageBox.className = 'form-message success';
                        messageBox.textContent = body.message || 'Gracias, te contactaremos pronto.';
                        form.reset();
                    } else {
                        messageBox.className = 'form-message error';
                        messageBox.textContent = body.error || 'Ocurrió un error. Intenta de nuevo.';
                    }
                })
                .catch(() => {
                    messageBox.className = 'form-message error';
                    messageBox.textContent = 'Error de conexión. Intenta de nuevo.';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar mensaje';
                });
            });

            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
                return '';
            }
        });
    </script>

</body>
</html>
